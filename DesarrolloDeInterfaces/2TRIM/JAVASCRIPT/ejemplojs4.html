<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        
        // Sumar dos números +
        let operacion = 2 + 2;
        console.log("Suma de 2 + 2 = "+operacion);
        // Restar dos números -
        operacion = 4 - 2;
        console.log("Resta de 4 - 2 = "+operacion);
        // Multiplicar dos números *
        operacion = 4 * 4;
        console.log("Multiplicar 4 x 4 = "+operacion);
        // Dividir dos números /
        operacion = 5 / 3;
        console.log("División de 5 / 3 = "+operacion);
        // Modulo de la división de 2 números (Nos devuelve el resto de una división)
        operacion = 5 % 4;
        console.log("El resto de la división de 5 / 3 es: "+ operacion);
    </script>
</head>
<body>
    <h2>Demo JavaScript en &lt; Head &gt; </h2>
    <p>Abre la consola del navegador para ver el resultado</p>
</body>
</html>
